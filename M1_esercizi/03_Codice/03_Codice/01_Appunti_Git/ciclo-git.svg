<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-labelledby="titolo descrizione" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titolo">Ciclo di lavoro con Git</title>
  <desc id="descrizione">Quattro passi in sequenza: modifica dei file, git add, git commit, git push verso GitHub.</desc>
  <rect x="0" y="0" width="760" height="150" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="10" y="45" width="150" height="60" rx="8" fill="#eef2f7" stroke="#40546b" stroke-width="2"/>
    <text x="85" y="72">modifica</text>
    <text x="85" y="92">dei file</text>

    <rect x="205" y="45" width="150" height="60" rx="8" fill="#eef2f7" stroke="#40546b" stroke-width="2"/>
    <text x="280" y="80" font-family="Consolas, monospace">git add</text>

    <rect x="400" y="45" width="150" height="60" rx="8" fill="#eef2f7" stroke="#40546b" stroke-width="2"/>
    <text x="475" y="80" font-family="Consolas, monospace">git commit</text>

    <rect x="595" y="45" width="150" height="60" rx="8" fill="#dceadd" stroke="#2f6b3a" stroke-width="2"/>
    <text x="670" y="72" font-family="Consolas, monospace">git push</text>
    <text x="670" y="92" font-size="13">su GitHub</text>

    <path d="M 160 75 L 200 75" stroke="#40546b" stroke-width="2" fill="none"/>
    <path d="M 192 69 L 203 75 L 192 81 Z" fill="#40546b"/>
    <path d="M 355 75 L 395 75" stroke="#40546b" stroke-width="2" fill="none"/>
    <path d="M 387 69 L 398 75 L 387 81 Z" fill="#40546b"/>
    <path d="M 550 75 L 590 75" stroke="#40546b" stroke-width="2" fill="none"/>
    <path d="M 582 69 L 593 75 L 582 81 Z" fill="#40546b"/>

    <text x="380" y="28" font-size="16" font-weight="bold" fill="#40546b">Il ciclo di lavoro quotidiano</text>
  </g>
</svg>
