<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Rap: proposta</title>
</head>
<body>

    <h1>Proponi un singolo/album</h1>


    <p>
        <label for="cognome">Cognome e nome</label> <br>
        <input type="text" id="cognome" name="cognome" size="40" required>
    </p>


    
   <fieldset>
    <legend>Proposta</legend>

    
    <p>
        <label for="scelta">E' un singolo o un'album?</label>
        <select id="scelta" name="scelta">
            <option value="singolo">Singolo</option>
            <option value="album">Album</option>
        </select>
    </p>

    <p>
        <label for="nomeproposta">Nome del singolo/album</label> <br>
        <input type="text" id="proposta" name="proposta" size="40" required>
    </p>
   </fieldset>
